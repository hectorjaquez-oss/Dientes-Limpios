<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#5DCAA5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cepillado Mágico">
<title>🦷 Cepillado Mágico</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--teal:#5DCAA5;--blue:#378ADD;--purple:#7F77DD;--pd:#534AB7;--gold:#FAC775;--font:'Nunito',sans-serif}
html,body{height:100%;font-family:var(--font);background:#1a1a2e;overflow:hidden}
#app{width:100%;height:100vh;background:linear-gradient(160deg,var(--teal) 0%,var(--blue) 50%,var(--purple) 100%);display:flex;flex-direction:column;align-items:center;overflow-y:auto;overflow-x:hidden;position:relative}
.bubbles{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:hidden}
.bubble{position:absolute;border-radius:50%;background:rgba(255,255,255,0.08);animation:float linear infinite}
@keyframes float{0%{transform:translateY(110vh) scale(.8);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(-20vh) scale(1.1);opacity:0}}
.screen{position:relative;z-index:1;width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center;padding:22px 16px 36px;min-height:100vh}
.header{text-align:center;margin-bottom:10px}
.header h1{font-size:24px;font-weight:800;color:white;text-shadow:0 2px 12px rgba(0,0,0,.15)}
.header p{font-size:12px;color:rgba(255,255,255,.82);margin-top:2px}
.streak-section{margin-bottom:11px;display:flex;flex-direction:column;align-items:center;gap:5px}
.streak-label{font-size:11px;color:rgba(255,255,255,.75);text-transform:uppercase;letter-spacing:1px;font-weight:700}
.streak-dots{display:flex;gap:5px;flex-wrap:wrap;justify-content:center}
.dot{width:17px;height:17px;border-radius:50%;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.35);transition:all .4s cubic-bezier(.34,1.56,.64,1);position:relative}
.dot.done{background:var(--gold);border-color:var(--gold);transform:scale(1.15);box-shadow:0 0 10px rgba(250,199,117,.5)}
.dot.done::after{content:'★';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:9px;color:#412402}
.anim-badge{background:rgba(255,255,255,.18);border:1.5px solid rgba(255,255,255,.38);border-radius:20px;padding:4px 14px;font-size:12px;color:white;font-weight:700;margin-bottom:11px}
.timer-ring{position:relative;width:148px;height:148px;margin-bottom:11px}
.timer-ring svg{position:absolute;top:0;left:0;filter:drop-shadow(0 4px 16px rgba(0,0,0,.15))}
.timer-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center}
.timer-text .time{font-size:38px;font-weight:800;color:white;line-height:1;letter-spacing:-1px}
.timer-text .lbl{font-size:11px;color:rgba(255,255,255,.78);font-weight:600;margin-top:2px}
.prog-wrap{width:100%;background:rgba(255,255,255,.18);border-radius:10px;height:7px;margin-bottom:11px;overflow:hidden}
.prog-fill{height:100%;background:white;border-radius:10px;transition:width 1s linear}
.anim-card{width:100%;border-radius:18px;overflow:hidden;margin-bottom:10px;border:1.5px solid rgba(255,255,255,.2);position:relative;background:#000}
canvas{width:100%;height:auto;display:block}
.anim-overlay{position:absolute;inset:0;background:rgba(10,10,30,.45);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;cursor:pointer;border-radius:17px;transition:opacity .25s}
.play-circle{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.95);display:flex;align-items:center;justify-content:center;transition:transform .15s}
.play-circle:active{transform:scale(.93)}
.play-circle svg{width:26px;height:26px;fill:var(--pd);margin-left:4px}
.cat-pill{background:rgba(255,255,255,.22);border:1.5px solid rgba(255,255,255,.45);border-radius:20px;padding:4px 14px;font-size:12px;color:white;font-weight:700}
.anim-info{padding:8px 13px 11px}
.anim-name{font-size:13px;font-weight:700;color:white;line-height:1.35}
.anim-cat{display:inline-block;margin-top:4px;background:rgba(255,255,255,.15);border-radius:10px;padding:2px 9px;font-size:11px;color:rgba(255,255,255,.85);font-weight:600}
.tip-box{width:100%;background:rgba(255,255,255,.14);border:1.5px solid rgba(255,255,255,.25);border-radius:13px;padding:9px 13px;color:white;font-size:13px;font-weight:600;text-align:center;margin-bottom:11px;line-height:1.4;transition:all .3s ease}
.btn-primary{background:white;color:var(--pd);border:none;border-radius:50px;padding:14px 36px;font-size:16px;font-family:var(--font);font-weight:800;cursor:pointer;margin-bottom:10px;display:flex;align-items:center;gap:8px;transition:transform .15s,box-shadow .15s;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.btn-primary:active{transform:scale(.96)}
.btn-primary svg{width:18px;height:18px;fill:var(--pd)}
.btn-row{display:flex;gap:9px;flex-wrap:wrap;justify-content:center}
.btn-sec{background:rgba(255,255,255,.18);color:white;border:1.5px solid rgba(255,255,255,.4);border-radius:50px;padding:9px 20px;font-size:13px;font-family:var(--font);font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;transition:background .15s}
.btn-sec:active{background:rgba(255,255,255,.32)}
.btn-sec svg{width:15px;height:15px}
.celebration{display:none;flex-direction:column;align-items:center;gap:9px;margin-top:6px;animation:popIn .4s cubic-bezier(.34,1.56,.64,1)}
.celebration.show{display:flex}
@keyframes popIn{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}
.cel-emoji{font-size:46px;line-height:1}
.cel-title{font-size:21px;font-weight:800;color:white;text-align:center}
.cel-msg{font-size:13px;color:rgba(255,255,255,.88);text-align:center;font-weight:600}
.confetti-burst{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:999}
.confetti-piece{position:absolute;border-radius:2px;animation:confettiFall 2.5s ease-in forwards}
@keyframes confettiFall{0%{transform:translateY(-20px) rotate(0deg);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="app">
  <div class="bubbles" id="bubbles"></div>
  <div class="screen">
    <div class="header">
      <h1>🦷 Cepillado Mágico ✨</h1>
      <p>2 minutos de magia para tus dientes</p>
    </div>
    <div class="streak-section">
      <div class="streak-label" id="streak-label">Tu racha 🌟</div>
      <div class="streak-dots" id="streak-dots"></div>
    </div>
    <div class="anim-badge" id="anim-badge">Animación 1 de 10</div>
    <div class="timer-ring">
      <svg width="148" height="148" viewBox="0 0 148 148">
        <circle cx="74" cy="74" r="62" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="9"/>
        <circle id="ring-fill" cx="74" cy="74" r="62" fill="none" stroke="white" stroke-width="9"
          stroke-dasharray="389.56" stroke-dashoffset="0" stroke-linecap="round"
          transform="rotate(-90 74 74)" style="transition:stroke-dashoffset 1s linear,stroke .5s ease;"/>
      </svg>
      <div class="timer-text">
        <div class="time" id="timer-display">2:00</div>
        <div class="lbl" id="timer-lbl">minutos</div>
      </div>
    </div>
    <div class="prog-wrap"><div class="prog-fill" id="prog-fill" style="width:100%"></div></div>
    <div class="anim-card">
      <canvas id="anim-canvas" width="380" height="210"></canvas>
      <div class="anim-overlay" id="anim-overlay" onclick="startTimer()">
        <div class="play-circle"><svg viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg></div>
        <div class="cat-pill" id="overlay-cat">🌊 Mar</div>
      </div>
      <div class="anim-info">
        <div class="anim-name" id="anim-name">Cargando animación...</div>
        <span class="anim-cat" id="anim-cat-tag"></span>
      </div>
    </div>
    <div class="tip-box" id="tip-box">Presiona ▶ para empezar la animación y el cronómetro 🪥</div>
    <button class="btn-primary" id="btn-start" onclick="startTimer()">
      <svg viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg>
      ¡Empezar a cepillar!
    </button>
    <div class="btn-row">
      <button class="btn-sec hidden" id="btn-reset" onclick="resetTimer()">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-4.9"/></svg>
        Volver a intentar
      </button>
      <button class="btn-sec" id="btn-skip" onclick="skipScene()">
        <svg viewBox="0 0 24 24" fill="white"><polygon points="5,4 15,12 5,20"/><line x1="19" y1="5" x2="19" y2="19" stroke="white" stroke-width="2.5" stroke-linecap="round"/></svg>
        Otra animación
      </button>
    </div>
    <div class="celebration hidden" id="celebration">
      <div class="cel-emoji" id="cel-emoji">🎉</div>
      <div class="cel-title">¡Súper trabajo!</div>
      <div class="cel-msg" id="cel-msg">Tus dientes están brillantes 😁</div>
      <button class="btn-primary" style="margin-top:6px" onclick="nextRound()">
        <svg viewBox="0 0 24 24" fill="var(--pd)"><polygon points="5,3 19,12 5,21"/></svg>
        Siguiente animación
      </button>
    </div>
  </div>
</div>

<script>
// ─── CONSTANTS ───────────────────────────────────────────────────────────────
const TOTAL = 120, CIRC = 2 * Math.PI * 62;
const CW = 380, CH = 210;

// ─── UTILS ───────────────────────────────────────────────────────────────────
const rf = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(rf(a, b + 1));
const pick = arr => arr[ri(0, arr.length - 1)];

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = ri(0, i); [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ─── DRAW HELPERS ─────────────────────────────────────────────────────────────
function drawFish(ctx, x, y, sz, col, dir) {
  ctx.save(); ctx.translate(x, y);
  if (dir < 0) ctx.scale(-1, 1);
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.ellipse(0, 0, sz, sz * .55, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-sz + 1, 0); ctx.lineTo(-sz * 1.7, -sz * .5); ctx.lineTo(-sz * 1.7, sz * .5); ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.beginPath(); ctx.arc(sz * .42, -sz * .1, sz * .17, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(sz * .45, -sz * .1, sz * .09, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.28)'; ctx.lineWidth = sz * .13;
  ctx.beginPath(); ctx.moveTo(sz * .08, -sz * .48); ctx.lineTo(sz * .08, sz * .48); ctx.stroke();
  ctx.restore();
}

function drawButterfly(ctx, x, y, sz, col, t, phase) {
  const flap = Math.sin(t / 120 + phase);
  const wx = sz * Math.abs(flap);
  ctx.save(); ctx.translate(x, y);
  ctx.fillStyle = col + 'cc';
  ctx.beginPath(); ctx.ellipse(-wx * .5, -sz * .3, wx, sz * .55, -0.4, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(wx * .5, -sz * .3, wx, sz * .55, 0.4, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(-wx * .3, sz * .25, wx * .6, sz * .4, 0.4, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(wx * .3, sz * .25, wx * .6, sz * .4, -0.4, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#33333366'; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(0, -sz * .6); ctx.lineTo(0, sz * .6); ctx.stroke();
  ctx.restore();
}

function gradient(ctx, x1, y1, x2, y2, stops) {
  const g = ctx.createLinearGradient(x1, y1, x2, y2);
  stops.forEach(([p, c]) => g.addColorStop(p, c));
  return g;
}

function radialGlow(ctx, x, y, r, col) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, col); g.addColorStop(1, 'transparent');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
}

// ─── SCENES ──────────────────────────────────────────────────────────────────
function makeScene(name, cat, tip, initFn, drawFn) {
  return { name, cat, tip, state: null,
    init() { this.state = initFn(); },
    draw(ctx, t) { drawFn(ctx, t, this.state); }
  };
}

// 1. UNDERWATER
const FISH_COLS = ['#FF6B6B','#FFD93D','#4ECDC4','#FF8B94','#A8E6CF','#F7DC6F','#BB8FCE','#F0A500','#00CEC9','#FD79A8'];
const sceneUnderwater = makeScene(
  'Peces de colores en el arrecife de coral', '🌊 Mar',
  '🐠 Cuenta cuántos peces de colores distintos ves',
  () => ({
    fish: Array.from({length: 8}, () => ({
      x: rf(0, CW), y: rf(22, CH - 45), sz: rf(9, 17), phase: rf(0, Math.PI * 2),
      spd: rf(.35, .62) * (Math.random() > .5 ? 1 : -1), col: pick(FISH_COLS)
    })),
    bubbles: Array.from({length: 15}, () => ({
      x: rf(0, CW), y: rf(CH - 90, CH), r: rf(2, 5), spd: rf(.25, .5), drift: rf(-.3, .3)
    })),
    coral: Array.from({length: 6}, () => ({
      x: rf(25, CW - 25), col: pick(['#FF7675','#FDCB6E','#E17055','#A29BFE','#FD79A8','#74B9FF'])
    }))
  }),
  (ctx, t, s) => {
    ctx.fillStyle = gradient(ctx, 0, 0, 0, CH, [[0,'#0AB2D6'],[1,'#01588C']]); ctx.fillRect(0, 0, CW, CH);
    for (let i = 0; i < 6; i++) {
      const x = 35 + i * 62, a = .03 + .015 * Math.sin(t / 2500 + i * 1.3);
      ctx.fillStyle = `rgba(255,255,210,${a})`; ctx.beginPath();
      ctx.moveTo(x, 0); ctx.lineTo(x - 38, CH); ctx.lineTo(x + 38, CH); ctx.closePath(); ctx.fill();
    }
    s.coral.forEach(c => {
      for (let a = -0.8; a <= 0.81; a += 0.4) {
        const tx = c.x + Math.sin(a) * 18, ty = CH - 24 - Math.abs(a) * 4;
        ctx.strokeStyle = c.col; ctx.lineWidth = 4; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(c.x, CH); ctx.lineTo(tx, ty); ctx.stroke();
        ctx.fillStyle = c.col; ctx.beginPath(); ctx.arc(tx, ty, 4.5, 0, Math.PI * 2); ctx.fill();
      }
    });
    for (let i = 0; i < 5; i++) {
      const sx = 38 + i * 72, sw = 11 * Math.sin(t / 1800 + i * .9);
      ctx.strokeStyle = i % 2 === 0 ? '#27AE60' : '#2ECC71'; ctx.lineWidth = 3.5; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(sx, CH);
      ctx.bezierCurveTo(sx + sw, CH - 28, sx - sw, CH - 58, sx + sw * .5, CH - 82); ctx.stroke();
    }
    s.fish.forEach(f => {
      f.x += f.spd; f.y += Math.sin(t / 900 + f.phase) * .4;
      if (f.x > CW + 30) f.x = -30; if (f.x < -30) f.x = CW + 30;
      f.y = Math.max(14, Math.min(CH - 38, f.y));
      drawFish(ctx, f.x, f.y, f.sz, f.col, f.spd > 0 ? 1 : -1);
    });
    s.bubbles.forEach(b => {
      b.y -= b.spd; b.x += b.drift;
      if (b.y < -10) { b.y = CH; b.x = rf(0, CW); }
      ctx.strokeStyle = `rgba(255,255,255,${.3 + .2 * Math.sin(t / 1000 + b.x)})`; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.stroke();
    });
  }
);

// 2. DEEP SEA JELLYFISH
const JEL_COLS = ['#A29BFE','#FD79A8','#74B9FF','#55EFC4','#FDCB6E'];
const sceneJellyfish = makeScene(
  'Medusas brillantes en el mar profundo', '🌊 Mar',
  '🪼 ¿De qué colores son las medusas que ves?',
  () => ({
    jelly: Array.from({length: 5}, () => ({
      x: rf(50, CW - 50), y: rf(30, CH - 50), sz: rf(22, 38),
      spd: rf(.15, .3) * (Math.random() > .5 ? 1 : -1),
      vspd: rf(.08, .18) * (Math.random() > .5 ? 1 : -1),
      col: pick(JEL_COLS), phase: rf(0, Math.PI * 2)
    })),
    particles: Array.from({length: 40}, () => ({
      x: rf(0, CW), y: rf(0, CH), r: rf(1, 3),
      col: pick(['#A29BFE','#74B9FF','#55EFC4']), a: rf(.1, .5)
    }))
  }),
  (ctx, t, s) => {
    ctx.fillStyle = gradient(ctx, 0, 0, 0, CH, [[0,'#1a0533'],[.5,'#0d1b4b'],[1,'#050e2e']]); ctx.fillRect(0, 0, CW, CH);
    s.particles.forEach(p => {
      const fa = p.a * (.5 + .5 * Math.sin(t / 1200 + p.x)); 
      ctx.fillStyle = p.col + Math.round(fa * 255).toString(16).padStart(2,'0');
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    });
    s.jelly.forEach(j => {
      j.x += j.spd; j.y += j.vspd;
      if (j.x > CW + j.sz) j.x = -j.sz; if (j.x < -j.sz) j.x = CW + j.sz;
      if (j.y > CH + j.sz) j.y = -j.sz; if (j.y < -j.sz) j.y = CH + j.sz;
      const pulse = .85 + .15 * Math.sin(t / 700 + j.phase);
      const w = j.sz * pulse, h = j.sz * .55 * pulse;
      radialGlow(ctx, j.x, j.y, w * 1.6, j.col + '33');
      ctx.fillStyle = j.col + 'aa';
      ctx.beginPath(); ctx.arc(j.x, j.y, w, Math.PI, 0);
      ctx.bezierCurveTo(j.x + w, j.y + h, j.x - w, j.y + h, j.x - w, j.y); ctx.fill();
      ctx.strokeStyle = j.col + 'cc'; ctx.lineWidth = 1;
      for (let i = -2; i <= 2; i++) {
        const tx = j.x + (i / 2.5) * w * .8;
        const len = j.sz * (.9 + .2 * Math.sin(t / 600 + j.phase + i));
        const wave = 8 * Math.sin(t / 700 + j.phase + i);
        ctx.beginPath(); ctx.moveTo(tx, j.y + h * .4);
        ctx.bezierCurveTo(tx + wave, j.y + h + len * .3, tx - wave, j.y + h + len * .7, tx + wave * .5, j.y + h + len);
        ctx.stroke();
      }
    });
  }
);

// 3. SPACE
const sceneSpace = makeScene(
  'Viaje por el sistema solar y las estrellas', '🚀 Espacio',
  '🪐 ¿Cuántos planetas y estrellas puedes reconocer?',
  () => ({
    stars: Array.from({length: 100}, () => ({x: rf(0, CW), y: rf(0, CH), r: rf(.5, 2.5), phase: rf(0, Math.PI * 2)})),
    shooters: [], lastShooter: 0,
    planet: {x: CW * .75, y: CH * .3, r: 32, col1: '#E17055', col2: '#FDCB6E'},
    planet2: {x: CW * .18, y: CH * .2, r: 14, col1: '#74B9FF', col2: '#0984E3'}
  }),
  (ctx, t, s) => {
    ctx.fillStyle = gradient(ctx, 0, 0, 0, CH, [[0,'#0a0015'],[.5,'#050b2e'],[1,'#010810']]); ctx.fillRect(0, 0, CW, CH);
    const ng = ctx.createRadialGradient(CW * .5, CH * .5, 0, CW * .5, CH * .5, CW * .6);
    ng.addColorStop(0, 'rgba(120,80,200,.08)'); ng.addColorStop(1, 'transparent');
    ctx.fillStyle = ng; ctx.fillRect(0, 0, CW, CH);
    s.stars.forEach(st => {
      const a = .4 + .5 * Math.sin(t / 1200 + st.phase);
      ctx.fillStyle = `rgba(255,255,255,${a})`; ctx.beginPath(); ctx.arc(st.x, st.y, st.r, 0, Math.PI * 2); ctx.fill();
    });
    if (t - s.lastShooter > 2800 + rf(0, 1200)) {
      s.shooters.push({x: rf(0, CW), y: rf(0, CH * .5), len: rf(40, 80), angle: rf(.3, .7), life: 1});
      s.lastShooter = t;
    }
    s.shooters = s.shooters.filter(sh => sh.life > 0);
    s.shooters.forEach(sh => {
      sh.x += Math.cos(sh.angle) * 8; sh.y += Math.sin(sh.angle) * 8; sh.life -= .04;
      const grad = ctx.createLinearGradient(sh.x - sh.len * Math.cos(sh.angle), sh.y - sh.len * Math.sin(sh.angle), sh.x, sh.y);
      grad.addColorStop(0, 'rgba(255,255,255,0)'); grad.addColorStop(1, `rgba(255,255,255,${sh.life})`);
      ctx.strokeStyle = grad; ctx.lineWidth = 2; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(sh.x - sh.len * Math.cos(sh.angle), sh.y - sh.len * Math.sin(sh.angle));
      ctx.lineTo(sh.x, sh.y); ctx.stroke();
    });
    [s.planet, s.planet2].forEach(p => {
      const pg = ctx.createRadialGradient(p.x - p.r * .3, p.y - p.r * .3, 0, p.x, p.y, p.r);

// ─── SCENE QUEUE ─────────────────────────────────────────────────────────────
const ALL_SCENES = [sceneUnderwater, sceneJellyfish, sceneSpace, sceneGarden, sceneFireflies, sceneBlossom, sceneSnow, sceneWaves, sceneAurora, sceneAutumn];

function loadAppState() {
  try {
    const s = JSON.parse(localStorage.getItem('cepillado_v3') || '{}');
    return { streak: s.streak||0, lastDate: s.lastDate||'', queueIdx: s.queueIdx||0, queueOrder: s.queueOrder||null, totalSessions: s.totalSessions||0 };
  } catch(e) { return {streak:0,lastDate:'',queueIdx:0,queueOrder:null,totalSessions:0}; }
}
function saveAppState() { try { localStorage.setItem('cepillado_v3', JSON.stringify(appState)); } catch(e) {} }

let appState = loadAppState();
if (!appState.queueOrder || appState.queueOrder.length !== ALL_SCENES.length) {
  appState.queueOrder = shuffle(ALL_SCENES.map((_,i)=>i));
  appState.queueIdx = 0;
}

function currentScene() { return ALL_SCENES[appState.queueOrder[appState.queueIdx % appState.queueOrder.length]]; }

function loadScene() {
  const sc = currentScene();
  sc.init();
  document.getElementById('anim-name').textContent = sc.name;
  document.getElementById('anim-cat-tag').textContent = sc.cat;
  document.getElementById('overlay-cat').textContent = sc.cat;
  const pos = (appState.queueIdx % ALL_SCENES.length) + 1;
  document.getElementById('anim-badge').textContent = `Animación ${pos} de ${ALL_SCENES.length} — ¡todas diferentes!`;
  document.getElementById('tip-box').textContent = 'Presiona ▶ para empezar la animación y el cronómetro 🪥';
  document.getElementById('anim-overlay').style.display = 'flex';
}

// ─── ANIMATION LOOP ───────────────────────────────────────────────────────────
let animId = null;
function startAnim() {
  const canvas = document.getElementById('anim-canvas');
  const ctx = canvas.getContext('2d');
  function loop(ts) {
    ctx.clearRect(0, 0, CW, CH);
    const sc = currentScene();
    if (sc && sc.state) sc.draw(ctx, ts);
    animId = requestAnimationFrame(loop);
  }
  if (animId) cancelAnimationFrame(animId);
  animId = requestAnimationFrame(loop);
}

  '🏆 ¡Ya casi! ¡Eres una campeona!'
];
const CEL_MSGS = [
  'Tus dientes están brillantes y perfectos 😁',
  '¡Qué dientes tan limpios y hermosos! 🌟',
  '¡Otra vez lo lograste, campeona! 🏆',
  '¡Tus dientes te lo agradecen! 🦷💖',
  '¡Eres una experta cepillándote! ⭐',
  '¡Sonríe, tienes los dientes más limpios! 😄',
  '¡Increíble! ¡Sigues superándote! 🎊'
];
const CEL_EMOJIS = ['🎉','🌟','🦷','🏆','💫','🎊','✨'];

function startTimer() {
  if (timerRunning) return;
  timerRunning = true;
  document.getElementById('anim-overlay').style.display = 'none';
  document.getElementById('btn-start').classList.add('hidden');
  document.getElementById('btn-skip').classList.add('hidden');
  document.getElementById('btn-reset').classList.remove('hidden');
  document.getElementById('celebration').classList.remove('show');
  document.getElementById('celebration').classList.add('hidden');
  document.getElementById('tip-box').textContent = TIPS[0];
  const milestones = [90, 70, 50, 30]; let tipIdx = 1;
  timerInterval = setInterval(() => {
    remaining--;
    if (milestones.includes(remaining) && tipIdx < TIPS.length)
      document.getElementById('tip-box').textContent = TIPS[tipIdx++];
    updateDisplay();
    if (remaining <= 0) { clearInterval(timerInterval); timerRunning = false; celebrate(); }
  }, 1000);
}

function updateDisplay() {
  const m = Math.floor(remaining / 60), s = remaining % 60;
  document.getElementById('timer-display').textContent = `${m}:${s.toString().padStart(2,'0')}`;
  const frac = remaining / TOTAL_SEC;
  document.getElementById('ring-fill').style.strokeDashoffset = CIRC_R * (1 - frac);
  document.getElementById('prog-fill').style.width = (frac * 100) + '%';
  if (remaining <= 30) {
    document.getElementById('ring-fill').style.stroke = '#FAC775';
    document.getElementById('prog-fill').style.background = '#FAC775';
  }
}

function celebrate() {
  const today = new Date().toDateString();
  if (appState.lastDate !== today) {
    appState.streak = appState.lastDate === new Date(Date.now()-86400000).toDateString() ? appState.streak+1 : 1;
    appState.lastDate = today;
  }
  appState.totalSessions++; saveAppState(); updateStreak(); launchConfetti();
  document.getElementById('btn-start').classList.add('hidden');
  document.getElementById('btn-reset').classList.add('hidden');
  document.getElementById('btn-skip').classList.add('hidden');
  const cel = document.getElementById('celebration');
  cel.classList.remove('hidden'); cel.classList.add('show');
  document.getElementById('cel-emoji').textContent = CEL_EMOJIS[(appState.totalSessions-1) % CEL_EMOJIS.length];
  document.getElementById('cel-msg').textContent = CEL_MSGS[(appState.totalSessions-1) % CEL_MSGS.length];
  document.getElementById('tip-box').textContent = `🦷 ¡${appState.streak} día${appState.streak!==1?'s':''} de racha! ¡Sigue así!`;
  document.getElementById('timer-display').textContent = '🎉';
  document.getElementById('ring-fill').style.strokeDashoffset = CIRC_R;
  document.getElementById('prog-fill').style.width = '0%';
}

function launchConfetti() {
  const colors = ['#FAC775','#5DCAA5','#7F77DD','#F0997B','#85B7EB','#ffffff'];
  const burst = document.createElement('div'); burst.className = 'confetti-burst'; document.body.appendChild(burst);
  for (let i = 0; i < 55; i++) {
    const p = document.createElement('div'); p.className = 'confetti-piece';
    p.style.cssText = `left:${rf(0,100)}%;top:-10px;background:${pick(colors)};width:${rf(6,14)}px;height:${rf(6,14)}px;border-radius:${Math.random()>.5?'50%':'2px'};animation-delay:${rf(0,1.2)}s;animation-duration:${rf(2,3.5)}s;`;
    burst.appendChild(p);
  }
  setTimeout(() => burst.remove(), 4500);
}

function skipScene() {
  if (timerRunning) return;
  appState.queueIdx++;
  if (appState.queueIdx >= appState.queueOrder.length) { appState.queueOrder = shuffle(ALL_SCENES.map((_,i)=>i)); appState.queueIdx = 0; }
  saveAppState(); loadScene();
}

function nextRound() {
  appState.queueIdx++;
  if (appState.queueIdx >= appState.queueOrder.length) { appState.queueOrder = shuffle(ALL_SCENES.map((_,i)=>i)); appState.queueIdx = 0; }
  saveAppState(); resetTimer();
}

function resetTimer() {
  clearInterval(timerInterval); timerRunning = false; remaining = TOTAL_SEC;
  document.getElementById('timer-display').textContent = '2:00';
  document.getElementById('timer-lbl').textContent = 'minutos';
  document.getElementById('ring-fill').style.strokeDashoffset = 0;
  document.getElementById('ring-fill').style.stroke = 'white';
  document.getElementById('prog-fill').style.width = '100%';
  document.getElementById('prog-fill').style.background = 'white';
  document.getElementById('btn-start').classList.remove('hidden');
  document.getElementById('btn-reset').classList.add('hidden');
  document.getElementById('btn-skip').classList.remove('hidden');
  document.getElementById('celebration').classList.remove('show');
  document.getElementById('celebration').classList.add('hidden');
  loadScene();
}

function updateStreak() {
  const dots = document.getElementById('streak-dots'); dots.innerHTML = '';
  document.getElementById('streak-label').textContent = appState.streak > 0
    ? `¡${appState.streak} día${appState.streak!==1?'s':''} seguido${appState.streak!==1?'s':''}! 🌟` : 'Tu racha 🌟';
  const show = Math.min(Math.max(appState.streak, 1), 14);
  for (let i = 0; i < show; i++) {
    const d = document.createElement('div'); d.className = 'dot' + (i < appState.streak ? ' done' : ''); dots.appendChild(d);
  }
}

// ─── BACKGROUND BUBBLES ───────────────────────────────────────────────────────
const bubblesEl = document.getElementById('bubbles');
for (let i = 0; i < 10; i++) {
  const b = document.createElement('div'); b.className = 'bubble';
  const sz = 20 + Math.random() * 55;
  b.style.cssText = `width:${sz}px;height:${sz}px;left:${Math.random()*100}%;animation-duration:${8+Math.random()*12}s;animation-delay:${Math.random()*10}s;`;
  bubblesEl.appendChild(b);
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
updateStreak();
loadScene();
startAnim();
</script>
</body>
</html>
