<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#5DCAA5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cepillado Mágico">
<title>🦷 Cepillado Mágico</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --teal: #5DCAA5; --blue: #378ADD; --purple: #7F77DD;
    --purple-dark: #534AB7; --gold: #FAC775; --white: #ffffff;
    --font: 'Nunito', sans-serif;
  }
  html, body { height: 100%; font-family: var(--font); background: #1a1a2e; overflow: hidden; }
  #app {
    width: 100%; height: 100vh;
    background: linear-gradient(160deg, var(--teal) 0%, var(--blue) 50%, var(--purple) 100%);
    display: flex; flex-direction: column; align-items: center;
    overflow-y: auto; overflow-x: hidden; position: relative;
  }
  .bubbles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; overflow: hidden; }
  .bubble { position: absolute; border-radius: 50%; background: rgba(255,255,255,0.08); animation: float linear infinite; }
  @keyframes float {
    0% { transform: translateY(110vh) scale(0.8); opacity: 0; }
    10% { opacity: 1; } 90% { opacity: 1; }
    100% { transform: translateY(-20vh) scale(1.1); opacity: 0; }
  }
  .screen {
    position: relative; z-index: 1; width: 100%; max-width: 420px;
    display: flex; flex-direction: column; align-items: center;
    padding: 24px 16px 36px; min-height: 100vh;
  }
  .header { text-align: center; margin-bottom: 10px; }
  .header h1 { font-size: 24px; font-weight: 800; color: white; letter-spacing: -0.5px; text-shadow: 0 2px 12px rgba(0,0,0,0.15); }
  .header p { font-size: 12px; color: rgba(255,255,255,0.82); margin-top: 2px; }
  .streak-section { margin-bottom: 12px; display: flex; flex-direction: column; align-items: center; gap: 5px; }
  .streak-label { font-size: 11px; color: rgba(255,255,255,0.75); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; }
  .streak-dots { display: flex; gap: 5px; flex-wrap: wrap; justify-content: center; }
  .dot { width: 17px; height: 17px; border-radius: 50%; background: rgba(255,255,255,0.18); border: 2px solid rgba(255,255,255,0.35); transition: all 0.4s cubic-bezier(.34,1.56,.64,1); position: relative; }
  .dot.done { background: var(--gold); border-color: var(--gold); transform: scale(1.15); box-shadow: 0 0 10px rgba(250,199,117,0.5); }
  .dot.done::after { content: '★'; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); font-size: 9px; color: #412402; }
  .video-badge { background: rgba(255,255,255,0.18); border: 1.5px solid rgba(255,255,255,0.38); border-radius: 20px; padding: 4px 14px; font-size: 12px; color: white; font-weight: 700; margin-bottom: 12px; }
  .timer-ring { position: relative; width: 148px; height: 148px; margin-bottom: 12px; }
  .timer-ring svg { position: absolute; top: 0; left: 0; filter: drop-shadow(0 4px 16px rgba(0,0,0,0.15)); }
  .timer-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); text-align: center; }
  .timer-text .time { font-size: 38px; font-weight: 800; color: white; line-height: 1; letter-spacing: -1px; }
  .timer-text .lbl { font-size: 11px; color: rgba(255,255,255,0.78); font-weight: 600; margin-top: 2px; }
  .prog-wrap { width: 100%; background: rgba(255,255,255,0.18); border-radius: 10px; height: 7px; margin-bottom: 12px; overflow: hidden; }
  .prog-fill { height: 100%; background: white; border-radius: 10px; transition: width 1s linear; }

  /* VIDEO PLAYER */
  .vid-card { width: 100%; background: rgba(0,0,0,0.3); border-radius: 18px; overflow: hidden; margin-bottom: 10px; border: 1.5px solid rgba(255,255,255,0.18); position: relative; }
  .vid-player { width: 100%; height: 190px; object-fit: cover; display: block; background: #000; }
  .vid-overlay { position: absolute; inset: 0; background: rgba(10,10,30,0.55); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; cursor: pointer; transition: opacity 0.25s; border-radius: 18px; }
  .play-circle { width: 64px; height: 64px; border-radius: 50%; background: rgba(255,255,255,0.95); display: flex; align-items: center; justify-content: center; transition: transform 0.15s; }
  .play-circle:active { transform: scale(0.93); }
  .play-circle svg { width: 26px; height: 26px; fill: var(--purple-dark); margin-left: 4px; }
  .cat-pill { background: rgba(255,255,255,0.22); border: 1.5px solid rgba(255,255,255,0.45); border-radius: 20px; padding: 4px 14px; font-size: 12px; color: white; font-weight: 700; }
  .vid-info { padding: 9px 13px 11px; }
  .vid-name { font-size: 13px; font-weight: 700; color: white; line-height: 1.35; }
  .vid-cat-tag { display: inline-block; margin-top: 4px; background: rgba(255,255,255,0.15); border-radius: 10px; padding: 2px 9px; font-size: 11px; color: rgba(255,255,255,0.85); font-weight: 600; }

  /* VIDEO ERROR */
  .vid-error { display: none; position: absolute; inset: 0; background: rgba(10,10,40,0.85); align-items: center; justify-content: center; flex-direction: column; gap: 8px; border-radius: 18px; }
  .vid-error p { color: white; font-size: 13px; font-weight: 700; text-align: center; padding: 0 16px; }
  .vid-error button { background: white; color: var(--purple-dark); border: none; border-radius: 20px; padding: 8px 20px; font-size: 13px; font-family: var(--font); font-weight: 700; cursor: pointer; }

  .tip-box { width: 100%; background: rgba(255,255,255,0.14); border: 1.5px solid rgba(255,255,255,0.25); border-radius: 13px; padding: 9px 13px; color: white; font-size: 13px; font-weight: 600; text-align: center; margin-bottom: 12px; line-height: 1.4; transition: all 0.3s ease; }
  .btn-primary { background: white; color: var(--purple-dark); border: none; border-radius: 50px; padding: 14px 36px; font-size: 16px; font-family: var(--font); font-weight: 800; cursor: pointer; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; transition: transform 0.15s, box-shadow 0.15s; box-shadow: 0 6px 24px rgba(0,0,0,0.18); }
  .btn-primary:active { transform: scale(0.96); }
  .btn-primary svg { width: 18px; height: 18px; fill: var(--purple-dark); }
  .btn-row { display: flex; gap: 9px; flex-wrap: wrap; justify-content: center; }
  .btn-sec { background: rgba(255,255,255,0.18); color: white; border: 1.5px solid rgba(255,255,255,0.4); border-radius: 50px; padding: 9px 20px; font-size: 13px; font-family: var(--font); font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: background 0.15s; }
  .btn-sec:active { background: rgba(255,255,255,0.32); }
  .btn-sec svg { width: 15px; height: 15px; }
  .celebration { display: none; flex-direction: column; align-items: center; gap: 9px; margin-top: 6px; animation: popIn 0.4s cubic-bezier(.34,1.56,.64,1); }
  .celebration.show { display: flex; }
  @keyframes popIn { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
  .cel-emoji { font-size: 46px; line-height: 1; }
  .cel-title { font-size: 21px; font-weight: 800; color: white; text-align: center; }
  .cel-msg { font-size: 13px; color: rgba(255,255,255,0.88); text-align: center; font-weight: 600; }
  .confetti-burst { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 999; }
  .confetti-piece { position: absolute; border-radius: 2px; animation: confettiFall 2.5s ease-in forwards; }
  @keyframes confettiFall { 0% { transform: translateY(-20px) rotate(0deg); opacity: 1; } 100% { transform: translateY(100vh) rotate(720deg); opacity: 0; } }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="app">
  <div class="bubbles" id="bubbles"></div>
  <div class="screen">

    <div class="header">
      <h1>🦷 Cepillado Mágico ✨</h1>
      <p>2 minutos de magia para tus dientes</p>
    </div>

    <div class="streak-section">
      <div class="streak-label" id="streak-label">Tu racha 🌟</div>
      <div class="streak-dots" id="streak-dots"></div>
    </div>

    <div class="video-badge" id="vid-badge">Video 1 de 20</div>

    <div class="timer-ring">
      <svg width="148" height="148" viewBox="0 0 148 148">
        <circle cx="74" cy="74" r="62" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="9"/>
        <circle id="ring-fill" cx="74" cy="74" r="62" fill="none" stroke="white" stroke-width="9"
          stroke-dasharray="389.56" stroke-dashoffset="0" stroke-linecap="round"
          transform="rotate(-90 74 74)" style="transition: stroke-dashoffset 1s linear, stroke 0.5s ease;"/>
      </svg>
      <div class="timer-text">
        <div class="time" id="timer-display">2:00</div>
        <div class="lbl" id="timer-lbl">minutos</div>
      </div>
    </div>

    <div class="prog-wrap">
      <div class="prog-fill" id="prog-fill" style="width:100%"></div>
    </div>

    <div class="vid-card">
      <video id="vid-player" class="vid-player" playsinline webkit-playsinline muted
        preload="none" loop crossorigin="anonymous"></video>
      <div class="vid-overlay" id="vid-overlay" onclick="startTimer()">
        <div class="play-circle">
          <svg viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg>
        </div>
        <div class="cat-pill" id="overlay-cat">🌊 Mar</div>
      </div>
      <div class="vid-error" id="vid-error">
        <span style="font-size:32px">😅</span>
        <p>Este video no cargó.<br>¡Prueba el siguiente!</p>
        <button onclick="skipVideo()">Siguiente video →</button>
      </div>
      <div class="vid-info">
        <div class="vid-name" id="vid-name">Cargando...</div>
        <span class="vid-cat-tag" id="vid-cat-tag"></span>
      </div>
    </div>

    <div class="tip-box" id="tip-box">Presiona ▶ para empezar el video y el cronómetro 🪥</div>

    <button class="btn-primary" id="btn-start" onclick="startTimer()">
      <svg viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg>
      ¡Empezar a cepillar!
    </button>

    <div class="btn-row">
      <button class="btn-sec hidden" id="btn-reset" onclick="resetTimer()">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round">
          <polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-4.9"/>
        </svg>
        Volver a intentar
      </button>
      <button class="btn-sec" id="btn-skip" onclick="skipVideo()">
        <svg viewBox="0 0 24 24" fill="white"><polygon points="5,4 15,12 5,20"/><line x1="19" y1="5" x2="19" y2="19" stroke="white" stroke-width="2.5" stroke-linecap="round"/></svg>
        Otro video
      </button>
    </div>

    <div class="celebration hidden" id="celebration">
      <div class="cel-emoji" id="cel-emoji">🎉</div>
      <div class="cel-title">¡Súper trabajo!</div>
      <div class="cel-msg" id="cel-msg">Tus dientes están brillantes 😁</div>
      <button class="btn-primary" style="margin-top:6px" onclick="nextRound()">
        <svg viewBox="0 0 24 24" fill="white"><polygon points="5,3 19,12 5,21"/></svg>
        Siguiente video
      </button>
    </div>

  </div>
</div>

<script>
const TOTAL = 120;
const CIRC = 2 * Math.PI * 62;

// Videos libres de Pixabay (CDN directo, sin restricciones de Family Link)
const ALL_VIDEOS = [
  { url:"https://cdn.pixabay.com/video/2016/01/05/1930-150268418_large.mp4", name:"Peces de colores nadando en el mar", cat:"🌊 Mar", tip:"🐠 Cuenta cuántos peces de colores distintos ves" },
  { url:"https://cdn.pixabay.com/video/2020/07/30/46215-447087541_large.mp4", name:"Olas del mar en cámara lenta", cat:"🌊 Mar", tip:"🌊 Respira cuando sube la ola, exhala cuando baja" },
  { url:"https://cdn.pixabay.com/video/2019/09/12/27021-360529578_large.mp4", name:"Arrecife de coral bajo el agua", cat:"🌊 Mar", tip:"🐡 ¿Cuántas criaturas del mar puedes encontrar?" },
  { url:"https://cdn.pixabay.com/video/2016/08/13/4565-178772416_large.mp4", name:"Mariposas volando entre flores", cat:"🌿 Naturaleza", tip:"🦋 ¿Cuántos colores de mariposas puedes ver?" },
  { url:"https://cdn.pixabay.com/video/2020/04/06/35280-406625450_large.mp4", name:"Flores de colores meciéndose", cat:"🌿 Naturaleza", tip:"🌸 ¿Cuántas flores puedes contar?" },
  { url:"https://cdn.pixabay.com/video/2016/09/07/5286-182781944_large.mp4", name:"Bosque verde con rayos de sol", cat:"🌿 Naturaleza", tip:"🌳 Imagina que caminas por este bosque mágico" },
  { url:"https://cdn.pixabay.com/video/2020/08/15/47569-451136484_large.mp4", name:"Cascada entre montañas", cat:"🌿 Naturaleza", tip:"💧 Cuenta los chorros de agua de la cascada" },
  { url:"https://cdn.pixabay.com/video/2015/09/03/597-138580370_large.mp4", name:"Nubes moviéndose en el cielo azul", cat:"🌤 Cielo", tip:"☁️ ¿Qué figuras ves en las nubes?" },
  { url:"https://cdn.pixabay.com/video/2020/07/01/44447-435879914_large.mp4", name:"Estrellas y vía láctea en la noche", cat:"🚀 Espacio", tip:"✨ Cuenta las estrellas que puedas ver" },
  { url:"https://cdn.pixabay.com/video/2016/06/29/3941-172394283_large.mp4", name:"Puesta de sol sobre el horizonte", cat:"🌤 Cielo", tip:"🌅 ¿Cuántos colores tiene el atardecer?" },
  { url:"https://cdn.pixabay.com/video/2019/11/07/29134-371649960_large.mp4", name:"Nieve cayendo en el bosque", cat:"❄️ Invierno", tip:"❄️ Imagina que agarras copos de nieve" },
  { url:"https://cdn.pixabay.com/video/2016/03/25/2752-161096543_large.mp4", name:"Río tranquilo entre árboles", cat:"🌿 Naturaleza", tip:"🌿 Escucha el sonido del río en tu mente" },
  { url:"https://cdn.pixabay.com/video/2020/06/19/43114-431402328_large.mp4", name:"Colores mezclándose en agua", cat:"🎨 Arte", tip:"🎨 ¿Qué figuras y formas ves aparecer?" },
  { url:"https://cdn.pixabay.com/video/2019/04/07/22709-329481201_large.mp4", name:"Burbujas de colores subiendo", cat:"🎨 Arte", tip:"🫧 Cuenta las burbujas que aparecen" },
  { url:"https://cdn.pixabay.com/video/2016/12/05/6775-195131447_large.mp4", name:"Fuegos artificiales de colores", cat:"🎆 Fiesta", tip:"🎆 ¿Cuántos colores puedes nombrar?" },
  { url:"https://cdn.pixabay.com/video/2020/05/25/40750-424296310_large.mp4", name:"Lluvia cayendo sobre el agua", cat:"🌧 Lluvia", tip:"🌧 Cuenta los círculos que hace cada gota" },
  { url:"https://cdn.pixabay.com/video/2016/06/22/3860-171694188_large.mp4", name:"Campo de girasoles al viento", cat:"🌻 Flores", tip:"🌻 Cuenta cuántos girasoles puedes ver" },
  { url:"https://cdn.pixabay.com/video/2019/08/22/26299-355827959_large.mp4", name:"Montañas y lago cristalino", cat:"🌍 Tierra", tip:"🏔 Imagina que eres exploradora de montañas" },
  { url:"https://cdn.pixabay.com/video/2020/03/23/34244-400991524_large.mp4", name:"Lapso de tiempo de nubes de tormenta", cat:"🌤 Cielo", tip:"⛅ ¿Hacia dónde van las nubes?" },
  { url:"https://cdn.pixabay.com/video/2016/05/25/3600-168933428_large.mp4", name:"Playa tropical con palmeras", cat:"🏖 Playa", tip:"🌴 Imagina que estás de vacaciones en la playa" },
];

const TIPS = [
  "💡 ¡Mueve el cepillo en círculos chiquitos!",
  "💡 No olvides los dientes de atrás",
  "⭐ ¡Ya llevas la mitad! ¡Sigue así!",
  "💡 Ahora cepilla la lengua suavemente",
  "🏆 ¡Ya casi! ¡Eres una campeona!"
];

const CEL_MSGS = [
  "Tus dientes están brillantes y perfectos 😁",
  "¡Qué dientes tan limpios y hermosos! 🌟",
  "¡Otra vez lo lograste, campeona! 🏆",
  "¡Tus dientes te lo agradecen! 🦷💖",
  "¡Eres una experta cepillándote! ⭐",
  "¡Sonríe, tienes los dientes más limpios! 😄",
  "¡Increíble! ¡Sigues superándote! 🎊",
];
const CEL_EMOJIS = ["🎉","🌟","🦷","🏆","💫","🎊","✨"];

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem('cepillado_v2') || '{}');
    return { streak: s.streak||0, lastDate: s.lastDate||'', queueIdx: s.queueIdx||0, queueOrder: s.queueOrder||null, totalSessions: s.totalSessions||0 };
  } catch(e) { return { streak:0, lastDate:'', queueIdx:0, queueOrder:null, totalSessions:0 }; }
}
function saveState() {
  try { localStorage.setItem('cepillado_v2', JSON.stringify(state)); } catch(e) {}
}

let state = loadState();
if (!state.queueOrder || state.queueOrder.length !== ALL_VIDEOS.length) {
  state.queueOrder = shuffle(ALL_VIDEOS.map((_,i)=>i));
  state.queueIdx = 0;
}

let remaining = TOTAL;
let interval = null;
let running = false;

function currentVideo() {
  return ALL_VIDEOS[state.queueOrder[state.queueIdx % state.queueOrder.length]];
}

function loadVideo(autoplay = false) {
  const v = currentVideo();
  const player = document.getElementById('vid-player');
  const errDiv = document.getElementById('vid-error');
  errDiv.style.display = 'none';

  player.src = v.url;
  player.load();

  player.onerror = () => {
    errDiv.style.display = 'flex';
  };

  if (autoplay) {
    player.muted = false;
    player.play().catch(() => { player.muted = true; player.play(); });
  }

  document.getElementById('vid-name').textContent = v.name;
  document.getElementById('vid-cat-tag').textContent = v.cat;
  document.getElementById('overlay-cat').textContent = v.cat;
  const pos = (state.queueIdx % ALL_VIDEOS.length) + 1;
  document.getElementById('vid-badge').textContent = `Video ${pos} de ${ALL_VIDEOS.length} — ¡todos diferentes!`;
  document.getElementById('tip-box').textContent = "Presiona ▶ para empezar el video y el cronómetro 🪥";
  document.getElementById('vid-overlay').style.display = 'flex';
}

function skipVideo() {
  if (running) return;
  state.queueIdx++;
  if (state.queueIdx >= state.queueOrder.length) {
    state.queueOrder = shuffle(ALL_VIDEOS.map((_,i)=>i));
    state.queueIdx = 0;
  }
  saveState();
  loadVideo(false);
}

function startTimer() {
  if (running) return;
  running = true;
  document.getElementById('vid-overlay').style.display = 'none';
  const player = document.getElementById('vid-player');
  player.muted = false;
  player.play().catch(() => { player.muted = true; player.play(); });

  document.getElementById('btn-start').classList.add('hidden');
  document.getElementById('btn-skip').classList.add('hidden');
  document.getElementById('btn-reset').classList.remove('hidden');
  document.getElementById('celebration').classList.remove('show');
  document.getElementById('celebration').classList.add('hidden');
  document.getElementById('tip-box').textContent = TIPS[0];

  const milestones = [90, 70, 50, 30];
  let tipIdx = 1;

  interval = setInterval(() => {
    remaining--;
    if (milestones.includes(remaining) && tipIdx < TIPS.length) {
      document.getElementById('tip-box').textContent = TIPS[tipIdx++];
    }
    updateDisplay();
    if (remaining <= 0) {
      clearInterval(interval);
      running = false;
      document.getElementById('vid-player').pause();
      celebrate();
    }
  }, 1000);
}

function updateDisplay() {
  const m = Math.floor(remaining / 60);
  const s = remaining % 60;
  document.getElementById('timer-display').textContent = `${m}:${s.toString().padStart(2,'0')}`;
  const frac = remaining / TOTAL;
  document.getElementById('ring-fill').style.strokeDashoffset = CIRC * (1 - frac);
  document.getElementById('prog-fill').style.width = (frac * 100) + '%';
  if (remaining <= 30) {
    document.getElementById('ring-fill').style.stroke = '#FAC775';
    document.getElementById('prog-fill').style.background = '#FAC775';
  }
}

function celebrate() {
  const today = new Date().toDateString();
  if (state.lastDate !== today) {
    state.streak = (state.lastDate === new Date(Date.now()-86400000).toDateString()) ? state.streak + 1 : 1;
    state.lastDate = today;
  }
  state.totalSessions++;
  saveState();
  updateStreak();
  launchConfetti();

  document.getElementById('btn-start').classList.add('hidden');
  document.getElementById('btn-reset').classList.add('hidden');
  document.getElementById('btn-skip').classList.add('hidden');
  const cel = document.getElementById('celebration');
  cel.classList.remove('hidden'); cel.classList.add('show');
  document.getElementById('cel-emoji').textContent = CEL_EMOJIS[(state.totalSessions-1) % CEL_EMOJIS.length];
  document.getElementById('cel-msg').textContent = CEL_MSGS[(state.totalSessions-1) % CEL_MSGS.length];
  document.getElementById('tip-box').textContent = `🦷 ¡${state.streak} día${state.streak!==1?'s':''} de racha! ¡Sigue así!`;
  document.getElementById('timer-display').textContent = '🎉';
  document.getElementById('ring-fill').style.strokeDashoffset = CIRC;
  document.getElementById('prog-fill').style.width = '0%';
}

function launchConfetti() {
  const colors = ['#FAC775','#5DCAA5','#7F77DD','#F0997B','#85B7EB','#ffffff'];
  const burst = document.createElement('div');
  burst.className = 'confetti-burst';
  document.body.appendChild(burst);
  for (let i = 0; i < 55; i++) {
    const p = document.createElement('div');
    p.className = 'confetti-piece';
    p.style.cssText = `left:${Math.random()*100}%;top:-10px;background:${colors[Math.floor(Math.random()*colors.length)]};width:${6+Math.random()*8}px;height:${6+Math.random()*8}px;border-radius:${Math.random()>.5?'50%':'2px'};animation-delay:${Math.random()*1.2}s;animation-duration:${2+Math.random()*1.5}s;`;
    burst.appendChild(p);
  }
  setTimeout(() => burst.remove(), 4000);
}

function nextRound() {
  state.queueIdx++;
  if (state.queueIdx >= state.queueOrder.length) {
    state.queueOrder = shuffle(ALL_VIDEOS.map((_,i)=>i));
    state.queueIdx = 0;
  }
  saveState();
  resetTimer();
}

function resetTimer() {
  clearInterval(interval);
  running = false;
  remaining = TOTAL;
  document.getElementById('vid-player').pause();
  document.getElementById('timer-display').textContent = '2:00';
  document.getElementById('timer-lbl').textContent = 'minutos';
  document.getElementById('ring-fill').style.strokeDashoffset = 0;
  document.getElementById('ring-fill').style.stroke = 'white';
  document.getElementById('prog-fill').style.width = '100%';
  document.getElementById('prog-fill').style.background = 'white';
  document.getElementById('btn-start').classList.remove('hidden');
  document.getElementById('btn-reset').classList.add('hidden');
  document.getElementById('btn-skip').classList.remove('hidden');
  document.getElementById('celebration').classList.remove('show');
  document.getElementById('celebration').classList.add('hidden');
  loadVideo(false);
}

function updateStreak() {
  const dots = document.getElementById('streak-dots');
  dots.innerHTML = '';
  document.getElementById('streak-label').textContent = state.streak > 0
    ? `¡${state.streak} día${state.streak!==1?'s':''} seguido${state.streak!==1?'s':''}! 🌟`
    : 'Tu racha 🌟';
  const show = Math.min(Math.max(state.streak, 1), 14);
  for (let i = 0; i < show; i++) {
    const d = document.createElement('div');
    d.className = 'dot' + (i < state.streak ? ' done' : '');
    dots.appendChild(d);
  }
}

// Burbujas de fondo
const bubblesEl = document.getElementById('bubbles');
for (let i = 0; i < 10; i++) {
  const b = document.createElement('div');
  b.className = 'bubble';
  const size = 20 + Math.random() * 60;
  b.style.cssText = `width:${size}px;height:${size}px;left:${Math.random()*100}%;animation-duration:${8+Math.random()*12}s;animation-delay:${Math.random()*10}s;`;
  bubblesEl.appendChild(b);
}

updateStreak();
loadVideo(false);
</script>
</body>
</html>
